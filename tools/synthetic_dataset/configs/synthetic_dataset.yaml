dataset_name: gazebo_aerial_v1
dataset_version: '2-human-mesh'
master_seed: 12345
count: 10000
output: datasets/gazebo_aerial_v1
class_mapping: class_mapping.yaml
asset_manifest: ../assets/manifests/assets.json
split_fractions: {train: 0.8, val: 0.1, test: 0.1}
# Quotas are allocated independently within each split using largest remainders.
scene_composition:
  train: {human_positive: 0.60, vehicle_only: 0.20, distractor_only: 0.10, empty: 0.10}
  val: {human_positive: 0.30, vehicle_only: 0.50, distractor_only: 0.10, empty: 0.10}
  test: {human_positive: 0.30, vehicle_only: 0.50, distractor_only: 0.10, empty: 0.10}
human_priority:
  enabled: true
  train_scene_counts: {single: 0.45, multi: 0.55}
  evaluation_scene_counts: {single: 0.60, multi: 0.40}
  multi_count_distribution: {'2_3': 0.40, '4_6': 0.35, '7_10': 0.20, '11_plus': 0.05}
  count_ranges: {'2_3': [2, 3], '4_6': [4, 6], '7_10': [7, 10], '11_plus': [11, 14]}
  distance_weights: {near: 0.30, medium: 0.30, far: 0.30, edge: 0.10}
  mixed_vehicle_fraction: 0.50
  mixed_vehicle_count: [1, 3]
  quota_tolerance: 0.05
  size_area_thresholds_px: {very_small: 64, small: 1024, medium: 9216}
  minimum_substantial_mixed_fraction: 0.30
  # Distance is drawn once per instance and retained across placement retries.
  grouping: {scattered: 0.35, loose_groups: 0.35, roadside: 0.30}
camera_source: src/wildlife_simulation/models/mono_cam/model.sdf
sampling:
  altitude_buckets_m: [10, 15, 20, 30, 40]
  altitude_jitter_m: 1.0
  off_nadir_buckets_deg: [0, 10, 20, 30]
  angle_jitter_deg: 2.0
  camera_yaw_deg: [0, 360]
  object_yaw_deg: [0, 360]
  roll_jitter_deg: 0.0
  negative_ratio: 0.1
  distractor_only_ratio: 0.1
  object_count_weights: [2, 3, 3, 3, 2, 2, 1, 1]
  distance_bands: {near: [0, 0.35], medium: [0.35, 0.70], far: [0.70, 0.90], edge: [0.90, 1.0]}
  distance_weights: {near: 0.3, medium: 0.3, far: 0.3, edge: 0.1}
  min_spacing_m: 0.4
  placement_attempts: 800
  occlusion_weights: {none: 0.80, mild: 0.15, moderate: 0.05}
  distractor_count: [2, 6]
lighting:
  morning: {elevation_deg: [15, 30], azimuth_deg: [20, 160], intensity: [0.8, 1.05], color: [1.0, 0.94, 0.84]}
  noon: {elevation_deg: [60, 85], azimuth_deg: [0, 360], intensity: [1.0, 1.3], color: [1.0, 1.0, 0.96]}
  evening: {elevation_deg: [8, 20], azimuth_deg: [200, 340], intensity: [0.7, 0.95], color: [1.0, 0.86, 0.72]}
  shadow: {elevation_deg: [25, 55], azimuth_deg: [0, 360], intensity: [0.85, 1.1], color: [0.95, 0.97, 1.0]}
backgrounds: [grass, dirt, road, mixed]
world:
  name: aerial_dataset
  rendering_engine: ogre2
  ground_z: 0.0
  ambient: [0.24, 0.26, 0.29, 1.0]
  anti_aliasing: 4
  background_size_m: 240
  zone_spacing_m: 500
  pool_copies_per_variant: 3
  staging_x_m: -1000
  step_s: 0.01
  real_time_factor: 8
capture:
  settling_frames: 3
  sync_tolerance_s: 0.001
  pose_tolerance_m: 0.001
  orientation_tolerance: 0.00001
  timeout_s: 40
  max_retries: 3
annotation:
  method: native_visible_2d
  min_box_px: 3
  min_box_area_px: 9
  visibility_threshold: null
  association_min_iou: 0.01
  association_containment_padding_px: 1.0
  bbox_max_is_inclusive: true
qa:
  previews: 100
  audit_frames: 300
  low_iou_frames: 50
  median_iou_goal: 0.90
  low_percentile_investigation: 0.75
